# Project registry: name -> Telegram topic, paths, checks.
# THE PROJECT-NAME CONTRACT: a project is named only by its `name` or one of its `aliases`, everywhere (board items,
# briefs' Project lines, reports). The guard stores an alias as the name and refuses any other name. Add an alias
# here (exact spelling) when the owner uses a new one; never invent names like "{{private:BRAND_AI}} SEO" or "team-wide".
