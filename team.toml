# openclaw-team: the single source of truth for the agent team.
# Edit here, then run `bin/team apply` on the host. Agents cannot change any of this.

[team]
name = "aihub"
openclaw_home = "~/.openclaw"
workspace_root = "~/.openclaw/workspace"
token_guard_repo = "~/openclaw-token-guard"   # where the token-guard plugin is checked out on the host
lock_files = true                              # chattr +i on generated files (needs passwordless sudo)

[owner]
name = "{{private:OWNER_NAME}}"
telegram_id = "{{private:OWNER_TELEGRAM_ID}}"
handle = "{{private:OWNER_HANDLE}}"          # Telegram @username, mentioned when a decision or approval is needed

[telegram]
chat_id = "{{private:TEAM_CHAT_ID}}"   # the team's forum group
system_topic = 160           # Team / General: system notices and daily report
default_topic = 160
postmortem_topic = 2596
secrets_dir = "~/.openclaw/secrets"

[models]
orchestrator = { primary = "anthropic/claude-opus-5-5", fallbacks = [], thinking = "medium" }   # owner 2026-11-17: never downgrade models to save tokens
specialists  = { primary = "anthropic/claude-sonnet-5-5", fallbacks = [], thinking = "low" }   # owner 2026-11-13: Sonnet 5.5 or higher, never Sonnet 5
spawn_allowed = [                  # owner 2026-11-17: never take Opus away to save tokens
  "anthropic/claude-opus-5-5",
  "anthropic/claude-sonnet-5-5",   # a retired version leaves this list; the guard moves its requests to the next one
  "anthropic/claude-haiku-5-5",
]
spawn_thinking = ["off", "minimal", "low", "medium", "high"]

[limits]
bootstrap_max_chars = 34000      # generated AGENTS.md files stay well below this (raised 2026-11-09 for the pre-approval and user-path rules)
remote_browser_timeout_ms = 120000 # OpenClaw hard-codes 1.5 s / 3 s for a remote browser; the laptop Team Chrome's link answers in 0.6-3 s, up to 9 s. Owner approved 120 s (2026-11-11). apply sets it.
remote_browser_attach_ms = 30000 # OpenClaw tries the page attach (snapshot/click/navigate) for 5/7/9 s; the laptop Team Chrome needs 6.1-9.8 s (2026-11-14). apply sets 30 s, +15 s per retry.
model_runtime_build_timeout_ms = 600000 # OpenClaw gives each agent's model setup a fixed 120 s at startup; it took 168-249 s here and the orchestrator stayed locked after three starts (2026-11-16). apply sets 10 min.
mcp_defer_tools = true           # OpenClaw forces every tool schema into every model call (alwaysLoad: true); apply sets false so Claude Code loads a schema only when needed (2026-11-16: 1.2B cached reads a day, ~51k tokens before a task starts).
cli_stable_system_prompt = true  # OpenClaw built the orchestrator's system prompt differently for the owner's messages, guard wakes, worker results and the web UI; each switch restarted its Claude process and re-cached the whole conversation (2026-11-17: 70 times in one session, ~1/3 of its cost). apply moves those per-run sections into the turn, where the model still reads them.
voice_timeout_seconds = 180 # owner voice notes: the laptop GPU answers in seconds; the server CPU fallback took 88 s for a 9 s note under load (2026-11-14), so 90 s failed.
telegram_cache_keep_days = 0      # OpenClaw's retained Telegram cache never expires and is loaded whole on the main thread (22k entries, 2026-11-14); apply trims it while the gateway is stopped
worker_context_tokens = 100000       # a worker session compacts here (workers start at ~40k); Sonnet 5.5 had 1,000,000 by default (2026-11-14). 100k since 2026-11-17 (owner: cut the reads).
orchestrator_context_tokens = 90000  # the orchestrator compacts here: it starts at ~46k and its conversation never resets (median call 113k, ~630M reads a day on 2026-11-15). 2026-11-17.
exec_background_ms = 120000      # OpenClaw sends any command that runs over 10 s to the background and the model polls it: 5.8k polls in 4 days in writer+devops, ~75k cached tokens each (2026-11-13..17). 120 s (OpenClaw's maximum) lets most commands finish in the one call.
max_concurrent_tasks = 10        # tasks running at once, whole team (owner 2026-11-10: 1-3 per agent by role; per agent: max_tasks)
task_timeout_seconds = 3600
task_budget_tokens = 15000000    # tokens one task may process before it must finish (the Claude CLI reports little usage)
task_budget_calls = 100          # tool calls one task may make before it must finish (what actually stops a runaway task)
orchestrator_run_calls = 60      # tool calls in one orchestrator run (a wake or an owner message); telling the owner stays allowed

[pace]                           # the plan's weekly limit lasts the week (token-guard reads the CLI's usage every 10 min)
enabled = true                   # on again after the 2026-11-21 reset: off, the team spent the week by mid-week and stood idle 2 days
ahead_percent = 5                # how far ahead of an even 7-day pace the team may run
reserve_percent = 85             # owner 2026-11-21 (cost): above 85% of the week, only the owner's conversations run
five_hour_percent = 85           # owner 2026-11-21 (cost): no new task above 85% of the 5-hour window

[jobs]                           # anti-stall follow-ups (token-guard job tracker)
stall_minutes = 30
wake_after_end_minutes = 4
idle_check_minutes = 30
max_wakes_per_day = 48

[triage]                         # owner's request: a cheap check that wakes the orchestrator with the right effort
enabled = true
every_minutes = 10               # at most this often, and only when something needs a decision (no tokens otherwise)
model = "anthropic/claude-haiku-5-5"
max_wakes_per_day = 24           # Opus wakes the triage may cause per day
same_state_rewake_minutes = 180  # an unchanged board does not wake the orchestrator again within this time

[board]                          # the task board (token-guard + oc-inbox)
agent = "product"                # the PM: audits the board and may edit it
audit_every_minutes = 180        # at most this often, and only when the board has problems
topics = true                    # posts and replies go to the topic of the project they are about
max_open = 20                    # the PM adds no items while this many are open (owner 2026-11-09: finish before adding)
wip = 14                         # items in hand at once (owner 2026-11-10: 1-3 jobs per agent; 0 = no queue). 14 since 2026-11-16: items waiting in Review on CI held 6 of 10 slots while 69 waited in To do
max_no_progress = 2             # owner 2026-11-21 (cost): after 2 tasks in a row that moved nothing, no third try without a rescope
require_done_when = true        # owner 2026-11-21: no dispatch without a checkable finish line (item done_when or a brief line)
max_tasks_per_item = 10          # an item that has had this many tasks gets no more: what is left goes on small items (2026-11-15: items past 10 took 51% of all tasks and mostly never reached Done)
# The owner's order (2026-11-06) for items the PM has not ranked: money first (the PM ranks those 1, 2, ...),
# then {{private:BRAND_AI}} AI ({{private:BRAND_AI_SLUG}}.com), {{private:BRAND_AI}} Hub, {{private:BRAND_GAME}}, openclaw-ui, then team work.
project_order = ["ai", "{{private:BRAND_AI_SLUG}}-hub", "{{private:BRAND_GAME_SLUG}}", "openclaw-ui", "team"]

[ci]                             # the guard follows pipelines (workers report RESULT: waiting with the link)
poll_seconds = 120
max_wait_minutes = 150
gitlab_token_file = "~/.openclaw/secrets/gitlab-pipeline-watch.token"   # read-only pipeline access
github_token_file = "~/.openclaw/secrets/github-farhadjafari385.token"

[sessions]                       # session clean-up (team gc, hourly)
delete_finished_task_after_minutes = 30
delete_idle_after_hours = 24

[crons]                          # automations that must stay off (watchdogs burn tokens)
disabled = ["openclaw-ui 10m stall check", "Daily team report", "Memory Dreaming Promotion"]

[tool_trim]                      # tool definitions are re-sent on every model call (about 128k chars for a worker in
                                 # 2026-11-06): leave out what an agent can never use on this headless server
nobody = ["computer", "mobile_ui", "theme", "dashboard", "portal", "canvas", "terminal", "talk_voice", "tts",
          "skill_workshop", "progress_card", "codex_threads", "codex_plugins", "codex_session_send", "codex_session_read",
          "codex_sessions_list", "codex_session_interrupt", "codex_endpoint_probe"]
workers = ["sessions_spawn", "sessions_send", "sessions", "automations", "cron", "ask_user", "message",
           "conversations_send", "conversations_turn", "subagents", "agents_wait"]   # the guard blocks most of these for workers anyway

# ---- MCP servers: tools from other programs (verified sources, versions pinned). Each agent lists the
# ones it may use (mcp = [...]); every other agent gets a deny rule for that server's tools.
[mcp.servers.devtools]       # Google's official Chrome DevTools: performance, console, network (Apache-2.0). QA only:
                             # each session starts its own Chrome, and the server is short of memory (2026-11-06: 2.9 GB swap in use).
                             # --no-proxy-server: the gateway egress proxy (secrets.egressProxy) injects HTTPS_PROXY with a password in the URL that Chrome ignores, so every page got 407 (b12cc5aa); Chrome now goes direct.
                             # Playwright MCP was left out: agents already have OpenClaw's browser tool and Playwright via webapp-testing.
command = "~/.openclaw/tools/node-v24.21.0/bin/npx"
args = ["-y", "chrome-devtools-mcp@1.12.0", "--headless", "--isolated", "--usageStatistics=false", "--chrome-arg=--no-proxy-server", "--executablePath", "~/.cache/ms-playwright/chromium-1248/chrome-linux64/chrome"]

[mcp.servers.context7]       # Upstash Context7: current library documentation (MIT); sends library queries to Upstash
url = "https://mcp.context7.com/mcp"
transport = "streamable-http"

# ---- agents ----
# role = file in roles/, persona = file in personas/, bot = Telegram account id, handle = that bot's @username.
# tools = OpenClaw tool policy for the agent (on top of token-guard).
# task_budget_calls = tool calls one task of this agent may make (default: [limits] task_budget_calls).
# max_tasks = tasks this agent may run at once (owner 2026-11-10: "between 1-3 jobs per agent, depends on the role").

[[agents]]
id = "coordinator"
skills = ["healthcheck", "reconcile-ci-handoffs", "red-pipeline-triage", "{{private:BRAND_AI_SLUG}}-production-access"]   # the only skills this agent sees
