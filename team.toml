[graphs]
# Code maps (graphify) for every project with `graph` repos in projects.toml: built from origin's default
# branch every 30 minutes (`team graphs`), tree-sitter only (no AI calls). The guard makes every task in
# such a project query its map before it searches or reads code. Change `version` to upgrade graphify.
version = "0.9.104"
root = "~/graphs"                       # ~/graphs/<project>/graphify-out/graph.json
budget = 1500                           # token cap of one map query

# Browsers the agents may attach to (OpenClaw browser.profiles, attach-only: OpenClaw never launches them).
# laptop = the owner's "Team Chrome" on {{private:LAPTOP_NODE}} (own profile, logged into the owner's accounts the team
# needs), reached through an SSH tunnel to the server's loopback (laptop user services team-chrome and
# team-chrome-tunnel). Owner 2026-11-09: give the team the laptop browser; OpenClaw has no browser-only grant
# for the node browser (it needs operator.admin, which would also open exec on the laptop).
[browser_profiles.laptop]
cdp_url = "http://127.0.0.1:19222"
